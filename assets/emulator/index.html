<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lõi Giả Lập Retro Clan Arcade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas#nes-canvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      aspect-ratio: 4 / 3;
    }
    #game-container {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 10 !important;
      display: none;
      background: #000;
    }
    #game-container.active {
      display: block !important;
    }
    .ejs_canvas_parent, #game-container canvas {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain !important;
    }
    /* Ẩn triệt để thông báo chữ đỏ, thanh menu, popup và bảng điều khiển nội bộ của EmulatorJS */
    .ejs_menu_bar,
    .ejs_context_menu,
    .ejs_popup_container,
    .ejs_virtualGamepad_parent,
    .ejs_virtualGamepad_open,
    .ejs_message {
      display: none !important;
      pointer-events: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }
    #loading-box {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(12, 17, 30, 0.95);
      border: 2px solid #D4AF37;
      border-radius: 12px;
      padding: 24px 32px;
      z-index: 50;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
      max-width: 85%;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      color: #F2ECE1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-align: center;
      line-height: 1.5;
    }
    #status-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      color: #00ff88;
      font-family: monospace;
      font-size: 11px;
      background: rgba(0, 0, 0, 0.8);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 136, 0.4);
      pointer-events: none;
      z-index: 100;
      display: none;
    }
    /* Bộ lọc đồ họa CRT Scanlines hoài cổ thập niên 90 */
    #crt-scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
      display: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
      background-size: 100% 3px, 6px 100%;
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.75);
    }
    #crt-scanlines.active {
      display: block !important;
    }
  </style>
  <script src="jsnes.min.js"></script>
</head>
<body>
  <div id="viewport">
    <div id="status-overlay">Sẵn sàng</div>

    <!-- Lớp phủ CRT Scanlines hoài cổ -->
    <div id="crt-scanlines"></div>

    <!-- Hộp thông báo nạp game -->
    <div id="loading-box">
      <div class="spinner"></div>
      <div id="loading-text">Đang chuẩn bị hệ thống trò chơi...</div>
    </div>

    <!-- Màn hình Canvas NES (100% offline) -->
    <canvas id="nes-canvas" width="256" height="240"></canvas>

    <!-- Màn hình Giả lập Arcade / Neo Geo / SNES / GBA -->
    <div id="game-container"></div>
  </div>

  <script>
    // Bật preserveDrawingBuffer để hỗ trợ chụp khung hình và truyền trực tiếp qua LAN
    (function() {
      const origGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function(type, attributes) {
        if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
          attributes = attributes || {};
          attributes.preserveDrawingBuffer = true;
        }
        return origGetContext.call(this, type, attributes);
      };
    })();

    const canvas = document.getElementById('nes-canvas');
    const ctx = canvas.getContext('2d');
    const statusOverlay = document.getElementById('status-overlay');
    const gameContainer = document.getElementById('game-container');
    const loadingBox = document.getElementById('loading-box');
    const loadingText = document.getElementById('loading-text');

    function isIgnorableError(err) {
      if (!err) return false;
      const str = String(err.message || err.reason || err).toLowerCase();
      return str.includes('permission was denied') ||
             str.includes('notallowederror') ||
             str.includes("reading '0'") ||
             str.includes('reading "0"') ||
             str.includes('user gesture') ||
             str.includes('audiocontext') ||
             str.includes('the request is not allowed') ||
             str.includes('interrupted by a call to pause') ||
             str.includes('interrupted') ||
             str.includes('play() can only be initiated') ||
             str.includes('script error');
    }

    // Bắt lỗi toàn cục hiển thị lên màn hình
    window.onerror = function(msg, url, line) {
      if (isIgnorableError(msg)) {
        console.warn('Ignored non-fatal error:', msg);
        return true;
      }
      if (loadingText) {
        loadingText.innerHTML = '<span style="color:#ff6b6b">Lỗi: ' + msg + ' (Dòng ' + line + ')</span>';
        loadingBox.style.display = 'flex';
      }
    };

    window.addEventListener('unhandledrejection', function(event) {
      const reasonMsg = event.reason ? (event.reason.message || String(event.reason)) : '';
      if (isIgnorableError(reasonMsg)) {
        console.warn('Ignored non-fatal rejection:', reasonMsg);
        event.preventDefault();
        return;
      }
      if (loadingText) {
        loadingText.innerHTML = '<span style="color:#ff6b6b">Lỗi: ' + (reasonMsg || 'Promise rejected') + '</span>';
        loadingBox.style.display = 'flex';
      }
    });

    // Tự động ghi nhận mọi AudioContext được tạo bởi bất kỳ core nào (EmulatorJS, OpenAL, JSNES)
    window.__allAudioContexts = window.__allAudioContexts || [];
    (function() {
      const OrigAC = window.AudioContext || window.webkitAudioContext;
      if (OrigAC) {
        const PatchedAC = function(...args) {
          const instance = new OrigAC(...args);
          window.__allAudioContexts.push(instance);
          if (typeof attachAudioTapToContext === 'function') {
            attachAudioTapToContext(instance);
          }
          return instance;
        };
        PatchedAC.prototype = OrigAC.prototype;
        window.AudioContext = window.webkitAudioContext = PatchedAC;
      }
    })();

    // Mở khóa âm thanh Web Audio / WebKit trên iOS và Android ngay khi có chạm màn hình hoặc bấm nút
    function unlockAudio() {
      try {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(function() {});
        }
        if (window.EJS_emulator) {
          if (typeof window.EJS_emulator.unmute === 'function') window.EJS_emulator.unmute();
          if (typeof window.EJS_emulator.setVolume === 'function') window.EJS_emulator.setVolume(1.0);
          if (window.EJS_emulator.audioContext && window.EJS_emulator.audioContext.state === 'suspended') {
            window.EJS_emulator.audioContext.resume().catch(function() {});
          }
          if (window.EJS_emulator.gameManager) {
            const gm = window.EJS_emulator.gameManager;
            if (gm.audioCtx && gm.audioCtx.state === 'suspended') {
              gm.audioCtx.resume().catch(function() {});
            }
            if (gm.soundContext && gm.soundContext.state === 'suspended') {
              gm.soundContext.resume().catch(function() {});
            }
            if (typeof gm.setVolume === 'function') {
              gm.setVolume(1.0);
            }
          }
          if (window.EJS_emulator.paused && typeof window.EJS_emulator.play === 'function') {
            const p = window.EJS_emulator.play();
            if (p && typeof p.catch === 'function') p.catch(function() {});
          }
        }
      } catch (e) {}
    }

    window.addEventListener('touchstart', unlockAudio, { passive: true, capture: true });
    window.addEventListener('touchend', unlockAudio, { passive: true, capture: true });
    window.addEventListener('pointerdown', unlockAudio, { passive: true, capture: true });
    window.addEventListener('click', unlockAudio, { passive: true, capture: true });

    if (loadingBox) {
      loadingBox.addEventListener('click', function() {
        unlockAudio();
        loadingBox.style.display = 'none';
      });
      loadingBox.addEventListener('touchstart', function() {
        unlockAudio();
        loadingBox.style.display = 'none';
      }, { passive: true });
    }

    const SCREEN_WIDTH = 256;
    const SCREEN_HEIGHT = 240;

    let imageData = ctx.createImageData(SCREEN_WIDTH, SCREEN_HEIGHT);
    let buf = new ArrayBuffer(imageData.data.length);
    let buf8 = new Uint8ClampedArray(buf);
    let buf32 = new Uint32Array(buf);

    let isRunning = false;
    let animFrameId = null;
    let isEmulatorJsMode = false;
    let p2Connected = false;
    let speedRate = 1;

    // Web Audio API cho NES
    let audioCtx = null;
    let scriptNode = null;
    let audioBufferQueue = [];
    const AUDIO_BUFFER_SIZE = 2048;

    function initAudio() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext({ sampleRate: 44100 });
        scriptNode = audioCtx.createScriptProcessor(AUDIO_BUFFER_SIZE, 0, 2);
        scriptNode.onaudioprocess = function(e) {
          const left = e.outputBuffer.getChannelData(0);
          const right = e.outputBuffer.getChannelData(1);
          for (let i = 0; i < AUDIO_BUFFER_SIZE; i++) {
            if (audioBufferQueue.length > 0) {
              const sample = audioBufferQueue.shift();
              left[i] = sample[0];
              right[i] = sample[1];
            } else {
              left[i] = 0;
              right[i] = 0;
            }
          }
        };
        scriptNode.connect(audioCtx.destination);
      } catch (err) {}
    }

    // Lõi JSNES
    const nes = new jsnes.NES({
      onFrame: function(frameBuffer) {
        for (let i = 0; i < frameBuffer.length; i++) {
          buf32[i] = 0xFF000000 | frameBuffer[i];
        }
        imageData.data.set(buf8);
        ctx.putImageData(imageData, 0, 0);
      },
      onAudioSample: function(left, right) {
        if (audioCtx && audioBufferQueue.length < AUDIO_BUFFER_SIZE * 4) {
          audioBufferQueue.push([left, right]);
        }
      }
    });

    function frameLoop() {
      if (!isRunning) return;
      for (let s = 0; s < speedRate; s++) {
        nes.frame();
      }
      animFrameId = requestAnimationFrame(frameLoop);
    }

    function getButtonCode(btnName) {
      switch (btnName.toUpperCase()) {
        case 'A': return jsnes.Controller.BUTTON_A;
        case 'B': return jsnes.Controller.BUTTON_B;
        case 'SELECT': return jsnes.Controller.BUTTON_SELECT;
        case 'START': return jsnes.Controller.BUTTON_START;
        case 'UP': return jsnes.Controller.BUTTON_UP;
        case 'DOWN': return jsnes.Controller.BUTTON_DOWN;
        case 'LEFT': return jsnes.Controller.BUTTON_LEFT;
        case 'RIGHT': return jsnes.Controller.BUTTON_RIGHT;
        default: return null;
      }
    }

    // Ánh xạ nút sang Gamepad ID của EmulatorJS (Chính xác tuyệt đối 100%, không dính Hotkey lưu slot)
    const EJS_BUTTON_IDS = {
      'UP': 4,
      'DOWN': 5,
      'LEFT': 6,
      'RIGHT': 7,
      'A': 0,      // RetroPad B / Key Z -> Neo Geo Button A (Đặt bom / Action 1)
      'B': 8,      // RetroPad A / Key X -> Neo Geo Button B (Dừng bom / Action 2)
      'C': 1,      // RetroPad Y / Key C -> Neo Geo Button C (Action 3)
      'D': 9,      // RetroPad X / Key V -> Neo Geo Button D (Action 4)
      'SELECT': 2, // SELECT / COIN
      'START': 3   // START
    };

    // Bảng phím chi tiết cho Arcade / Neo Geo (Đã loại bỏ hoàn toàn phím 1 và 5 để không bị nhảy Save State Slot 1)
    const ARCADE_KEY_MAP = {
      1: {
        'UP': [{ key: 'ArrowUp', code: 'ArrowUp', keyCode: 38 }],
        'DOWN': [{ key: 'ArrowDown', code: 'ArrowDown', keyCode: 40 }],
        'LEFT': [{ key: 'ArrowLeft', code: 'ArrowLeft', keyCode: 37 }],
        'RIGHT': [{ key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 }],
        'A': [{ key: 'z', code: 'KeyZ', keyCode: 90 }],
        'B': [{ key: 'x', code: 'KeyX', keyCode: 88 }],
        'C': [{ key: 'c', code: 'KeyC', keyCode: 67 }],
        'D': [{ key: 'v', code: 'KeyV', keyCode: 86 }],
        'SELECT': [
          { key: '5', code: 'Digit5', keyCode: 53 },
          { key: 'Shift', code: 'ShiftRight', keyCode: 16 }
        ],
        'START': [
          { key: '1', code: 'Digit1', keyCode: 49 },
          { key: 'Enter', code: 'Enter', keyCode: 13 }
        ]
      },
      2: {
        'UP': [{ key: 'w', code: 'KeyW', keyCode: 87 }],
        'DOWN': [{ key: 's', code: 'KeyS', keyCode: 83 }],
        'LEFT': [{ key: 'a', code: 'KeyA', keyCode: 65 }],
        'RIGHT': [{ key: 'd', code: 'KeyD', keyCode: 68 }],
        'A': [{ key: 'j', code: 'KeyJ', keyCode: 74 }],
        'B': [{ key: 'k', code: 'KeyK', keyCode: 75 }],
        'C': [{ key: 'u', code: 'KeyU', keyCode: 85 }],
        'D': [{ key: 'i', code: 'KeyI', keyCode: 73 }],
        'SELECT': [
          { key: '6', code: 'Digit6', keyCode: 54 },
          { key: 'o', code: 'KeyO', keyCode: 79 }
        ],
        'START': [
          { key: '2', code: 'Digit2', keyCode: 50 },
          { key: 'p', code: 'KeyP', keyCode: 80 }
        ]
      }
    };

    function dispatchKey(item, isPressed) {
      const type = isPressed ? 'keydown' : 'keyup';
      const eventInit = {
        key: item.key,
        code: item.code,
        keyCode: item.keyCode,
        which: item.keyCode,
        bubbles: true,
        cancelable: true
      };
      const evt = new KeyboardEvent(type, eventInit);
      window.dispatchEvent(evt);
      document.dispatchEvent(evt);
      if (document.body) {
        document.body.dispatchEvent(evt);
      }

      const canvasEl = document.querySelector('#game-container canvas') || document.querySelector('canvas');
      if (canvasEl) {
        canvasEl.dispatchEvent(new KeyboardEvent(type, eventInit));
      }
    }

    window.playerInput = function(player, btnName, isPressed) {
      if (isPressed) {
        unlockAudio();
      }
      if (!isEmulatorJsMode) {
        // NES Mode
        const code = getButtonCode(btnName);
        if (code !== null) {
          if (isPressed) nes.buttonDown(player, code);
          else nes.buttonUp(player, code);
        }
      } else {
        // Arcade / Neo Geo / SNES Mode
        const pIndex = player - 1;
        const btnId = EJS_BUTTON_IDS[btnName.toUpperCase()];
        const val = isPressed ? 1 : 0;

        if (btnId !== undefined && window.EJS_emulator && window.EJS_emulator.gameManager) {
          const gm = window.EJS_emulator.gameManager;
          try {
            if (typeof gm.simulateInput === 'function') {
              gm.simulateInput(pIndex, btnId, val);
            }
            if (gm.functions && typeof gm.functions.simulateInput === 'function') {
              gm.functions.simulateInput(pIndex, btnId, val);
            }
            const mod = gm.Module || window.EJS_emulator.Module;
            if (mod && typeof mod.simulate_input === 'function') {
              mod.simulate_input(pIndex, btnId, val);
            }
          } catch(e) {}
        }

        // Đảm bảo nút START và SELECT được giữ ít nhất 220ms để lõi Arcade nhận đủ frame
        if ((btnName.toUpperCase() === 'START' || btnName.toUpperCase() === 'SELECT') && isPressed) {
          setTimeout(() => {
            try {
              if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                const gm = window.EJS_emulator.gameManager;
                if (typeof gm.simulateInput === 'function') gm.simulateInput(pIndex, btnId, 0);
                if (gm.functions && typeof gm.functions.simulateInput === 'function') gm.functions.simulateInput(pIndex, btnId, 0);
              }
            } catch(e) {}
          }, 220);
        }

        // 2. Dispatch bàn phím song song để 100% core và hệ máy arcade đều nhận
        const pMap = ARCADE_KEY_MAP[player] || ARCADE_KEY_MAP[1];
        const keys = pMap[btnName.toUpperCase()];
        if (keys && keys.length > 0) {
          for (let i = 0; i < keys.length; i++) {
            dispatchKey(keys[i], isPressed);
          }
        }
      }
    };

    let turboInterval = null;
    function updateSpeedTurbo() {
      if (turboInterval) {
        clearInterval(turboInterval);
        turboInterval = null;
      }
      if (speedRate <= 2) return;

      // Khi speedRate là 4 hoặc 8:
      // Tự động gọi thêm hàm Module._retro_run() để tăng tốc độ game lên 4x và 8x
      const extraSteps = speedRate === 4 ? 2 : 6;
      turboInterval = setInterval(() => {
        if (speedRate <= 2) {
          clearInterval(turboInterval);
          turboInterval = null;
          return;
        }
        try {
          const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
          const mod = (gm && gm.Module) || (window.EJS_emulator && window.EJS_emulator.Module);
          if (mod && typeof mod._retro_run === 'function') {
            for (let i = 0; i < extraSteps; i++) {
              mod._retro_run();
            }
          }
        } catch(e) {}
      }, 16);
    }

    window.setSpeed = function(multiplier) {
      speedRate = Number(multiplier) || 1;
      if (window.EJS_emulator) {
        try {
          const emu = window.EJS_emulator;
          const gm = emu.gameManager;
          const ratioStr = speedRate.toFixed(1);

          if (typeof emu.changeSetting === 'function') {
            emu.changeSetting('ff-ratio', ratioStr);
          }
          if (emu.settings) {
            emu.settings['ff-ratio'] = ratioStr;
          }
          try {
            localStorage.setItem('ejs_ff-ratio', ratioStr);
          } catch(e) {}

          // Button ID 27 là Fast Forward trong chuẩn EmulatorJS
          if (gm && typeof gm.simulateInput === 'function') {
            gm.simulateInput(0, 27, speedRate > 1 ? 1 : 0);
          }
          if (typeof emu.setSpeed === 'function') {
            emu.setSpeed(speedRate);
          }
          if (gm && typeof gm.setSpeed === 'function') {
            gm.setSpeed(speedRate);
          }
          if (gm && gm.functions && typeof gm.functions.setSpeed === 'function') {
            gm.functions.setSpeed(speedRate);
          }
          if (typeof emu.setFastForward === 'function') {
            emu.setFastForward(speedRate > 1);
          }
          if (gm && typeof gm.setFastForward === 'function') {
            gm.setFastForward(speedRate > 1);
          }
          if (emu.Module && typeof emu.Module._set_fastforward === 'function') {
            emu.Module._set_fastforward(speedRate > 1 ? 1 : 0);
          }
        } catch(e) {}
      }

      // Kích hoạt turbo stepper cho x4 và x8
      updateSpeedTurbo();

      // Giả lập phím Space (Hotkey tua nhanh mặc định của RetroArch)
      if (isEmulatorJsMode) {
        dispatchKey({ key: ' ', code: 'Space', keyCode: 32 }, speedRate > 1);
      }
    };

    window.toggleCrtFilter = function(enabled) {
      const el = document.getElementById('crt-scanlines');
      if (el) {
        if (enabled) el.classList.add('active');
        else el.classList.remove('active');
      }
    };

    window.rewindGame = function() {
      if (window.EJS_emulator) {
        try {
          if (typeof window.EJS_emulator.rewind === 'function') {
            window.EJS_emulator.rewind();
          } else if (typeof window.EJS_emulator.loadState === 'function') {
            window.EJS_emulator.loadState(9); // Quick Rewind Slot
          }
        } catch(e) {}
      }
    };

    window.activeCheats = window.activeCheats || {};
    window.applyCheatCode = function(cheatCode, enabled) {
      if (enabled === undefined) enabled = true;
      window.activeCheats[cheatCode] = enabled;

      if (window.EJS_emulator) {
        const emu = window.EJS_emulator;
        const gm = emu.gameManager;
        try {
          if (gm) {
            if (typeof gm.setCheat === 'function') {
              gm.setCheat(cheatCode, enabled);
            }
            if (enabled && typeof gm.addCheat === 'function') {
              gm.addCheat(cheatCode);
            }
            if (gm.cheats && Array.isArray(gm.cheats)) {
              const existing = gm.cheats.find(c => c.code === cheatCode);
              if (existing) {
                existing.enabled = enabled;
              } else if (enabled) {
                gm.cheats.push({ code: cheatCode, enabled: true });
              }
            }
          }
          if (typeof emu.addCheat === 'function' && enabled) {
            emu.addCheat(cheatCode);
          }
        } catch(e) {}
      }

      if (!isEmulatorJsMode && isRunning && nes) {
        try {
          const parts = cheatCode.split(':');
          if (parts.length === 2 && nes.mmap && typeof nes.mmap.write === 'function') {
            const addr = parseInt(parts[0], 16);
            const val = parseInt(parts[1], 16);
            if (!isNaN(addr) && !isNaN(val) && enabled) {
              nes.mmap.write(addr, val);
            }
          }
        } catch(e) {}
      }
      return true;
    };

    // Bộ nhớ RAM Freeze cho các mã cheat kiểu GameShark/ActionReplay
    setInterval(function() {
      if (!window.activeCheats || !window.EJS_emulator || !window.EJS_emulator.gameManager) return;
      const gm = window.EJS_emulator.gameManager;
      if (!gm.Module || !gm.Module.HEAPU8) return;
      const heap = gm.Module.HEAPU8;
      for (const code in window.activeCheats) {
        if (!window.activeCheats[code]) continue;
        if (code.length === 8 && code.startsWith('01')) {
          const val = parseInt(code.substr(2, 2), 16);
          const offset = parseInt(code.substr(4, 4), 16);
          if (!isNaN(val) && !isNaN(offset)) {
            for (let base of [0x100000, 0x200000, 0x000000]) {
              const target = base + offset;
              if (target < heap.length) {
                heap[target] = val;
              }
            }
          }
        }
      }
    }, 200);

    let screenFeedWs = null;
    let screenFeedInterval = null;
    let isCapturingFrame = false;
    let offscreenCanvas = null;
    let offscreenCtx = null;

    function getOffscreenCanvas() {
      if (!offscreenCanvas) {
        offscreenCanvas = document.createElement('canvas');
        // Chuẩn độ phân giải Full HD Retro 960x720 (3x Integer Scale siêu nét, giữ nguyên tỉ lệ 4:3)
        offscreenCanvas.width = 960;
        offscreenCanvas.height = 720;
        offscreenCtx = offscreenCanvas.getContext('2d', { alpha: false, desynchronized: true });
        offscreenCtx.imageSmoothingEnabled = false;
        offscreenCtx.webkitImageSmoothingEnabled = false;
        offscreenCtx.mozImageSmoothingEnabled = false;
      }
      return { canvas: offscreenCanvas, ctx: offscreenCtx };
    }

    let screenFeedRafId = null;
    let frameSkipCounter = 0;

    function startLiveScreenFeed() {
      stopLiveScreenFeed();

      function connectScreenWs() {
        if (!p2Connected) return;
        try {
          const host = window.location.hostname || '127.0.0.1';
          screenFeedWs = new WebSocket('ws://' + host + ':8989/screen_feed');
          screenFeedWs.binaryType = 'arraybuffer';
          screenFeedWs.onclose = () => {
            if (p2Connected) setTimeout(connectScreenWs, 1000);
          };
        } catch(e) {}
      }
      connectScreenWs();

      function onFrameLoop() {
        if (!p2Connected) {
          screenFeedRafId = null;
          return;
        }
        screenFeedRafId = requestAnimationFrame(onFrameLoop);
        frameSkipCounter++;
        // Khóa nhịp cứng 30 FPS theo VSync của trình giả lập, loại bỏ 100% hiện tượng lệch nhịp gây giật hình
        if (frameSkipCounter % 2 !== 0) return;
        if (!screenFeedWs || screenFeedWs.readyState !== WebSocket.OPEN) return;
        if (isCapturingFrame) return;

        try {
          const cvs = document.querySelector('#game-container canvas') || 
                      document.getElementById('nes-canvas') || 
                      document.querySelector('canvas');
          if (!cvs || cvs.width === 0 || cvs.height === 0) return;

          isCapturingFrame = true;
          const { canvas: offCvs, ctx: offCtx } = getOffscreenCanvas();
          offCtx.drawImage(cvs, 0, 0, 960, 720);
          offCvs.toBlob((blob) => {
            try {
              if (blob && p2Connected && screenFeedWs && screenFeedWs.readyState === WebSocket.OPEN) {
                screenFeedWs.send(blob);
              }
            } finally {
              isCapturingFrame = false;
            }
          }, 'image/jpeg', 0.88);
        } catch(e) {
          isCapturingFrame = false;
        }
      }
      screenFeedRafId = requestAnimationFrame(onFrameLoop);
    }

    function stopLiveScreenFeed() {
      if (screenFeedRafId) {
        cancelAnimationFrame(screenFeedRafId);
        screenFeedRafId = null;
      }
      if (screenFeedInterval) {
        clearInterval(screenFeedInterval);
        screenFeedInterval = null;
      }
      if (screenFeedWs) {
        try { screenFeedWs.close(); } catch(e) {}
        screenFeedWs = null;
      }
      isCapturingFrame = false;
    }

    // ================= AUDIO STREAMING CHO P2 =================
    // Tự động bắt toàn bộ luồng âm thanh game qua ScriptProcessor của Web Audio
    function __clanSendAudio(out) {
      if (!p2Connected || !audioFeedWs || audioFeedWs.readyState !== WebSocket.OPEN) return;
      try {
        if (!out || out.numberOfChannels === 0) return;
        const chan = out.getChannelData(0);
        const len = chan.length;
        if (len === 0) return;
        const i16 = new Int16Array(len);
        for (let i = 0; i < len; i++) {
          let s = Math.max(-1, Math.min(1, chan[i]));
          i16[i] = s < 0 ? (s * 32768) | 0 : (s * 32767) | 0;
        }
        audioFeedWs.send(i16.buffer);
      } catch(e) {}
    }

    (function() {
      const OrigAC = window.AudioContext || window.webkitAudioContext;
      if (OrigAC) {
        const origCreateSP = OrigAC.prototype.createScriptProcessor;
        OrigAC.prototype.createScriptProcessor = function(...args) {
          const node = origCreateSP.apply(this, args);
          let gameHandler = null;

          Object.defineProperty(node, 'onaudioprocess', {
            get: function() { return gameHandler; },
            set: function(fn) {
              gameHandler = fn;
              node.__clan_origHandler = function(e) {
                if (typeof fn === 'function') {
                  try { fn.call(node, e); } catch(err) {}
                }
                __clanSendAudio(e.outputBuffer);
              };
              node.addEventListener('audioprocess', node.__clan_origHandler);
            },
            configurable: true,
            enumerable: true
          });

          const origAddEventListener = node.addEventListener;
          node.addEventListener = function(type, listener, ...opts) {
            if (type === 'audioprocess' && typeof listener === 'function' && listener !== node.__clan_origHandler) {
              const wrapped = function(e) {
                try { listener.call(node, e); } catch(err) {}
                __clanSendAudio(e.outputBuffer);
              };
              return origAddEventListener.call(node, type, wrapped, ...opts);
            }
            return origAddEventListener.call(node, type, listener, ...opts);
          };

          return node;
        };
      }
    })();
    let audioFeedWs = null;
    let audioFeedTimer = null;
    window.__capturedAudioNodes = window.__capturedAudioNodes || [];

    function attachAudioTapToContext(actx) {
      if (!actx || actx.__clanTapInstalled) return;
      actx.__clanTapInstalled = true;

      try {
        const proc = actx.createScriptProcessor(2048, 1, 1);
        actx.__clanAudioProcessor = proc;

        proc.onaudioprocess = function(e) {
          if (!p2Connected || !audioFeedWs || audioFeedWs.readyState !== WebSocket.OPEN) return;
          const f32 = e.inputBuffer.getChannelData(0);
          const len = f32.length;
          if (len === 0) return;

          // Chuyển Float32 sang Int16 PCM (nhẹ gấp đôi, chất lượng âm thanh 100% CD nguyên gốc)
          const i16 = new Int16Array(len);
          for (let i = 0; i < len; i++) {
            let s = Math.max(-1, Math.min(1, f32[i]));
            i16[i] = s < 0 ? (s * 32768) | 0 : (s * 32767) | 0;
          }
          audioFeedWs.send(i16.buffer);
        };

        proc.connect(actx.destination);

        if (window.__capturedAudioNodes) {
          const origConnect = AudioNode.prototype.connect;
          window.__capturedAudioNodes.forEach(node => {
            if (node.context === actx && node !== proc) {
              try { origConnect.call(node, proc); } catch(e) {}
            }
          });
        }
      } catch(e) {}
    }

    // Tự động bắt toàn bộ luồng âm thanh game qua Web Audio API để truyền cho P2
    (function() {
      const origConnect = AudioNode.prototype.connect;
      AudioNode.prototype.connect = function(dest, ...args) {
        try {
          if (dest && (dest instanceof AudioDestinationNode || dest === this.context.destination)) {
            if (!window.__capturedAudioNodes.includes(this)) {
              window.__capturedAudioNodes.push(this);
            }
            if (this.context && this.context.__clanAudioProcessor && this !== this.context.__clanAudioProcessor) {
              try { origConnect.call(this, this.context.__clanAudioProcessor); } catch(e) {}
            }
          }
        } catch(e) {}
        return origConnect.apply(this, [dest, ...args]);
      };
    })();

    function startLiveAudioFeed() {
      stopLiveAudioFeed();

      function connectAudioWs() {
        if (!p2Connected) return;
        try {
          const host = window.location.hostname || '127.0.0.1';
          audioFeedWs = new WebSocket('ws://' + host + ':8989/audio_feed_source');
          audioFeedWs.binaryType = 'arraybuffer';
          audioFeedWs.onclose = () => {
            if (p2Connected) setTimeout(connectAudioWs, 1000);
          };
        } catch(e) {}
      }
      connectAudioWs();

      // Kiểm tra định kỳ để kết nối AudioContext ngay khi core giả lập tải xong
      audioFeedTimer = setInterval(() => {
        if (!p2Connected) {
          stopLiveAudioFeed();
          return;
        }

        // 1. Kiểm tra tất cả AudioContexts đã đăng ký
        if (window.__allAudioContexts) {
          window.__allAudioContexts.forEach(ctx => attachAudioTapToContext(ctx));
        }
        if (audioCtx) attachAudioTapToContext(audioCtx);

        // 2. Kiểm tra EmulatorJS và OpenAL
        try {
          const emu = window.EJS_emulator;
          if (emu) {
            if (emu.audioContext) attachAudioTapToContext(emu.audioContext);
            const gm = emu.gameManager;
            if (gm) {
              if (gm.audioCtx) attachAudioTapToContext(gm.audioCtx);
              if (gm.soundContext) attachAudioTapToContext(gm.soundContext);
              const al = gm.Module && gm.Module.AL;
              if (al && al.currentCtx && al.currentCtx.audioCtx) {
                attachAudioTapToContext(al.currentCtx.audioCtx);
              }
            }
          }
        } catch(e) {}
      }, 500);
    }

    function stopLiveAudioFeed() {
      if (audioFeedTimer) {
        clearInterval(audioFeedTimer);
        audioFeedTimer = null;
      }
      if (audioFeedWs) {
        try { audioFeedWs.close(); } catch(e) {}
        audioFeedWs = null;
      }
    }


    window.setP2Status = function(connected) {
      p2Connected = connected;
      if (connected) {
        startLiveScreenFeed();
        startLiveAudioFeed();
        // Cắm kết nối thiết bị tay cầm vào Port 1 (Player 2) trên lõi Libretro
        try {
          const emu = window.EJS_emulator;
          const gm = emu && emu.gameManager;
          const mod = (gm && gm.Module) || (emu && emu.Module);
          if (mod) {
            if (typeof mod._retro_set_controller_port_device === 'function') {
              mod._retro_set_controller_port_device(1, 1);
            } else if (typeof mod.ccall === 'function') {
              mod.ccall('retro_set_controller_port_device', null, ['number', 'number'], [1, 1]);
            }
          }
        } catch(e) {}
      } else {
        stopLiveScreenFeed();
        stopLiveAudioFeed();
      }
    };

    // Hiển thị thông báo Toast phong cách RetroClan
    function showToast(msg) {
      try {
        let toast = document.getElementById('clan-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'clan-toast';
          toast.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(19,28,49,0.92);border:1.5px solid #00E5FF;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:bold;font-family:sans-serif;z-index:99999;box-shadow:0 4px 15px rgba(0,0,0,0.7);transition:opacity 0.3s;pointer-events:none;';
          document.body.appendChild(toast);
        }
        toast.innerText = msg;
        toast.style.opacity = '1';
        toast.style.display = 'block';
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => {
          toast.style.opacity = '0';
          setTimeout(() => toast.style.display = 'none', 300);
        }, 2500);
      } catch(_) {}
    }

    // 1. Lưu tiến trình game hiện tại (Save State bền vững vào localStorage & Slot 1)
    window.saveGameState = function() {
      try {
        const titleKey = currentGameTitle || 'game_progress';
        if (!isEmulatorJsMode && nes) {
          const state = nes.toJSON();
          localStorage.setItem('retroclan_nes_' + titleKey, JSON.stringify(state));
          showToast('✅ Đã lưu tiến trình game!');
          return true;
        } else if (window.EJS_emulator) {
          // Lưu vào slot 1 EmulatorJS
          if (typeof window.EJS_emulator.saveState === 'function') {
            window.EJS_emulator.saveState(1);
          }
          // Lưu raw buffer trực tiếp vào localStorage để chắc chắn không mất sau khi thoát
          try {
            const gm = window.EJS_emulator.gameManager;
            if (gm && typeof gm.getState === 'function') {
              const stateBuf = gm.getState();
              if (stateBuf && stateBuf.length > 0) {
                let bin = '';
                const bytes = new Uint8Array(stateBuf.buffer || stateBuf);
                const len = bytes.byteLength;
                for (let i = 0; i < len; i++) {
                  bin += String.fromCharCode(bytes[i]);
                }
                const b64 = btoa(bin);
                localStorage.setItem('retroclan_state_' + titleKey, b64);
              }
            }
          } catch(e) {}
          showToast('✅ Đã lưu tiến trình game!');
          return true;
        }
      } catch(e) {
        console.error('Save state error:', e);
      }
      return false;
    };

    // 2. Tải lại tiến trình game đã lưu (Reload Save State)
    window.loadGameState = function() {
      try {
        const titleKey = currentGameTitle || 'game_progress';
        if (!isEmulatorJsMode && nes) {
          const data = localStorage.getItem('retroclan_nes_' + titleKey);
          if (data) {
            nes.fromJSON(JSON.parse(data));
            showToast('⚡ Đã tải lại tiến trình game!');
            return true;
          }
        } else if (window.EJS_emulator) {
          // Thử load từ slot 1 của EmulatorJS
          if (typeof window.EJS_emulator.loadState === 'function') {
            window.EJS_emulator.loadState(1);
          }
          // Thử load từ raw buffer trong localStorage nếu có
          try {
            const gm = window.EJS_emulator.gameManager;
            const b64 = localStorage.getItem('retroclan_state_' + titleKey);
            if (b64 && gm && typeof gm.loadState === 'function') {
              const bin = atob(b64);
              const bytes = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) {
                bytes[i] = bin.charCodeAt(i);
              }
              gm.loadState(bytes);
            }
          } catch(e) {}
          showToast('⚡ Đã tải lại tiến trình game!');
          return true;
        }
      } catch(e) {
        console.error('Load state error:', e);
      }
      return false;
    };

    window.resetGame = function() {
      if (!isEmulatorJsMode && isRunning) {
        nes.reset();
      } else {
        window.location.reload();
      }
    };

    // Khởi chạy lõi đa hệ máy (Tương thích toàn bộ 12 hệ máy) với CDN EmulatorJS
    function startEmulatorJs(coreType, romUrl, gameTitle) {
      isEmulatorJsMode = true;
      canvas.style.display = 'none';
      gameContainer.classList.add('active');
      gameContainer.style.setProperty('display', 'block', 'important');

      // Ánh xạ chính xác tên lõi sang core của EmulatorJS
      let mappedCore = (coreType || 'arcade').toLowerCase();
      let isArcade = false;

      if (mappedCore === 'arcade' || mappedCore === 'neogeo') {
        mappedCore = 'arcade';
        isArcade = true;
      } else if (mappedCore === 'mame') {
        mappedCore = 'mame2003plus';
        isArcade = true;
      } else if (mappedCore === 'genesis' || mappedCore === 'sega' || mappedCore === 'megadrive') {
        mappedCore = 'segaMD';
      } else if (mappedCore === 'psx' || mappedCore === 'ps1') {
        mappedCore = 'psx';
      } else if (mappedCore === 'gb' || mappedCore === 'gbc') {
        mappedCore = 'gb';
      } else if (mappedCore === 'snes') {
        mappedCore = 'snes';
      } else if (mappedCore === 'gba') {
        mappedCore = 'gba';
      } else if (mappedCore === 'nds') {
        mappedCore = 'nds';
      } else if (mappedCore === 'psp') {
        mappedCore = 'psp';
      } else if (mappedCore === 'n64') {
        mappedCore = 'n64';
      }

      loadingText.innerText = `Đang nạp dữ liệu ${coreType.toUpperCase()} (${gameTitle})...\nVui lòng đợi giây lát`;

      // Lấy tên định danh ngắn của ROM
      let rawRomName = romUrl.split('/').pop().split('?')[0].replace(/\.[^/.]+$/, '').toLowerCase();
      if (rawRomName.includes('neobombe') || rawRomName.includes('bomber')) {
        rawRomName = 'neobombe';
      }

      window.EJS_DEBUG_XX = true;
      window.EJS_player = '#game-container';
            window.EJS_core = mappedCore;
      window.EJS_gameUrl = romUrl;
      window.EJS_gameName = rawRomName;
      window.EJS_pathtodata = '/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_color = '#D4AF37';
      window.EJS_threads = false;
      window.EJS_hideSettings = true;
      window.EJS_Buttons = false;
      window.EJS_cheatPath = '/cheats/';
      window.EJS_cheats = [
        ["Tối đa số lượng bom (Max Bombs)", "010900C0"],
        ["Tối đa tầm nổ (Max Fire Range)", "010901C0"],
        ["Bất tử (Invincible)", "010105C0"]
      ];

      // Chỉ nạp BIOS Neo Geo cho hệ máy Arcade / Neo Geo (FBNeo)
      if (isArcade) {
        window.EJS_dontExtractBIOS = true;
        window.EJS_biosUrl = '/neogeo.zip';
        window.EJS_gameParentUrl = '/neogeo.zip';
        window.EJS_externalFiles = {
          "neogeo.zip": "/neogeo.zip",
          "/neogeo.zip": "/neogeo.zip"
        };
      }

      window.EJS_ready = function() {
        loadingText.innerText = `Đang khởi động hệ máy ${coreType.toUpperCase()}...`;
        if (window.EJS_emulator) {
          try {
            if (window.EJS_emulator.menu && typeof window.EJS_emulator.menu.close === 'function') {
              window.EJS_emulator.menu.close();
            }
          } catch(e) {}
        }
      };

      window.EJS_onGameStart = function() {
        loadingBox.style.display = 'none';
        if (window.EJS_emulator) {
          try {
            if (window.EJS_emulator.controls) {
              window.EJS_emulator.controls[1] = {
                0: { value: 75 },
                1: { value: 85 },
                2: { value: 54 },
                3: { value: 50 },
                4: { value: 87 },
                5: { value: 83 },
                6: { value: 65 },
                7: { value: 68 },
                8: { value: 74 },
                9: { value: 73 }
              };
            }
            const gm = window.EJS_emulator.gameManager;
            const mod = (gm && gm.Module) || window.EJS_emulator.Module;
            if (mod && typeof mod._retro_set_controller_port_device === 'function') {
              mod._retro_set_controller_port_device(1, 1);
            }
          } catch(e) {}
          try {
            if (window.EJS_emulator.menu && typeof window.EJS_emulator.menu.close === 'function') {
              window.EJS_emulator.menu.close();
            }
            if (window.EJS_emulator.paused && typeof window.EJS_emulator.play === 'function') {
              const playPromise = window.EJS_emulator.play();
              if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(function(e) {
                  console.warn('Autoplay suppressed by browser, will resume on touch:', e);
                });
              }
            }
          } catch(e) {}
        }
      };

      const script = document.createElement('script');
      script.src = '/data/loader.js';
      script.onerror = function() {
        // Fallback sang CDN trực tiếp nếu proxy local gặp sự cố
        const fallbackScript = document.createElement('script');
        fallbackScript.src = 'https://cdn.emulatorjs.org/4.2.3/data/loader.js';
        fallbackScript.onerror = function() {
          loadingText.innerHTML = '<span style="color:#ff6b6b">Lỗi kết nối CDN EmulatorJS.<br>Vui lòng kiểm tra lại mạng Internet.</span>';
        };
        document.body.appendChild(fallbackScript);
      };
      document.body.appendChild(script);
    }

    // Đọc thông số URL
    const params = new URLSearchParams(window.location.search);
    const core = (params.get('core') || 'nes').toLowerCase();
    const title = params.get('title') || 'Game';
    const romFile = params.get('file') || 'rom.data';

    loadingText.innerText = `Đang nạp file "${title}"...`;

    // Tải dữ liệu ROM từ máy chủ nội bộ
    fetch('/' + romFile)
      .then(res => {
        if (!res.ok) throw new Error('Không thể tải file ROM (' + res.status + ')');
        return res.arrayBuffer();
      })
      .then(buffer => {
        const bytes = new Uint8Array(buffer);
        // Kiểm tra xem có phải định dạng NES (iNES header 'NES\x1a')
        const isNes = bytes.length > 4 && bytes[0] === 0x4E && bytes[1] === 0x45 && bytes[2] === 0x53 && bytes[3] === 0x1A;

        if (isNes || core === 'nes') {
          // Lõi JSNES chạy 100% offline
          initAudio();
          let binaryStr = '';
          for (let i = 0; i < bytes.length; i++) {
            binaryStr += String.fromCharCode(bytes[i]);
          }
          nes.loadROM(binaryStr);
          isRunning = true;
          loadingBox.style.display = 'none';
          requestAnimationFrame(frameLoop);
        } else {
          // Lõi Arcade / Neo Geo (neobombe.zip)
          startEmulatorJs(core, '/' + romFile, title);
        }
      })
      .catch(err => {
        loadingText.innerHTML = '<span style="color:#ff6b6b">Lỗi nạp ROM: ' + err.message + '</span>';
      });

    window.addEventListener('click', () => {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });
  </script>
